<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FairShare - Bill Splitter</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-arrows::-webkit-outer-spin-button,
        .hide-arrows::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .hide-arrows {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <svg class="w-8 h-8 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">FairShare</h1>
            </div>
            <div class="text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1 rounded-full flex items-center gap-2">
                <span id="auth-status" class="w-2 h-2 rounded-full bg-slate-400"></span>
                <span id="auth-text">Connecting...</span>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Calculator -->
        <div class="lg:col-span-7 space-y-6">
            
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
                <h2 class="text-lg font-semibold mb-6 flex items-center gap-2">
                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    New Bill Split
                </h2>
                
                <form id="calculator-form" class="space-y-5">
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Restaurant Name</label>
                        <input type="text" id="restaurant-name" placeholder="e.g. The Rustic Spoon" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all placeholder:text-slate-400">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Total Bill Amount</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 flex items-center">
                                    <label for="currency-selector" class="sr-only">Currency</label>
                                    <select id="currency-selector" class="h-full rounded-l-xl border-0 bg-transparent py-0 pl-3 pr-6 text-slate-500 focus:ring-2 focus:ring-brand-500 sm:text-sm font-medium outline-none cursor-pointer text-center">
                                        <option value="₹">₹</option>
                                        <option value="$">$</option>
                                        <option value="€">€</option>
                                        <option value="£">£</option>
                                        <option value="¥">¥</option>
                                    </select>
                                </div>
                                <input type="number" id="total-bill" step="0.01" min="0" placeholder="0.00" class="hide-arrows w-full pl-16 pr-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Number of People</label>
                            <div class="relative">
                                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                                </span>
                                <input type="number" id="total-people" min="1" placeholder="2" class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Tip Percentage</label>
                        <div class="grid grid-cols-5 gap-2">
                            <button type="button" class="tip-btn py-2 rounded-lg border-2 border-slate-200 text-slate-600 font-medium hover:border-brand-500 hover:text-brand-600 transition-colors" data-tip="5">5%</button>
                            <button type="button" class="tip-btn active-tip py-2 rounded-lg border-2 border-brand-500 bg-brand-50 text-brand-700 font-medium transition-colors" data-tip="10">10%</button>
                            <button type="button" class="tip-btn py-2 rounded-lg border-2 border-slate-200 text-slate-600 font-medium hover:border-brand-500 hover:text-brand-600 transition-colors" data-tip="15">15%</button>
                            <button type="button" class="tip-btn py-2 rounded-lg border-2 border-slate-200 text-slate-600 font-medium hover:border-brand-500 hover:text-brand-600 transition-colors" data-tip="20">20%</button>
                            <input type="number" id="custom-tip" placeholder="Cust" class="hide-arrows w-full text-center px-1 py-2 rounded-lg border-2 border-slate-200 text-slate-600 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none transition-colors text-sm font-medium" min="0">
                        </div>
                    </div>

                    <div class="pt-4 border-t border-slate-100">
                        <div class="flex items-center justify-between mb-3 cursor-pointer" id="toggle-exception">
                            <label class="text-sm font-medium text-slate-700 flex items-center gap-2 cursor-pointer">
                                <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                Exceptions (e.g., someone skipped starters)
                            </label>
                            <svg id="exception-chevron" class="w-5 h-5 text-slate-400 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                        
                        <div id="exception-panel" class="hidden grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200 mt-2">
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">Excluded Item Cost</label>
                                <div class="relative">
                                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm dynamic-currency-symbol">₹</span>
                                    <input type="number" id="excluded-cost" step="0.01" min="0" placeholder="0.00" class="hide-arrows w-full pl-7 pr-3 py-2 text-sm rounded-lg border border-slate-300 focus:ring-1 focus:ring-amber-500 focus:border-amber-500 outline-none">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">People who skipped it</label>
                                <input type="number" id="excluded-people" min="0" placeholder="0" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:ring-1 focus:ring-amber-500 focus:border-amber-500 outline-none">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3.5 rounded-xl shadow-sm hover:shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2 mt-4">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2zM10 8.5a.5.5 0 11-1 0 .5.5 0 011 0zm5 5a.5.5 0 11-1 0 .5.5 0 011 0z"></path></svg>
                        Calculate Split
                    </button>
                </form>
            </div>

            <div id="results-area" class="hidden bg-gradient-to-br from-brand-50 to-emerald-50 rounded-2xl shadow-sm border border-brand-100 p-6 sm:p-8 transform transition-all duration-500 opacity-0 scale-95">
                <h3 class="text-sm font-semibold text-brand-600 uppercase tracking-wider mb-4">Calculation Results</h3>
                <div class="space-y-4" id="results-content">
                    <!-- Dynamic Content inserted here -->
                </div>
            </div>
        </div>

        <!-- Right Column: History -->
        <div class="lg:col-span-5">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 h-full flex flex-col max-h-[800px]">
                <div class="p-6 border-b border-slate-100">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Recent Splits
                    </h2>
                </div>
                
                <div class="flex-1 overflow-y-auto p-4 space-y-3" id="history-list">
                    <!-- Placeholder Loading State -->
                    <div class="animate-pulse space-y-3">
                        <div class="h-20 bg-slate-100 rounded-xl"></div>
                        <div class="h-20 bg-slate-100 rounded-xl"></div>
                    </div>
                </div>
                
                <div id="empty-history" class="hidden flex-col items-center justify-center p-8 text-center text-slate-500 h-full">
                    <svg class="w-12 h-12 text-slate-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <p class="font-medium">No past splits yet.</p>
                    <p class="text-sm mt-1">Calculations will be saved here automatically.</p>
                </div>
            </div>
        </div>

    </main>

    <div id="custom-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full mx-4 p-6 transform scale-95 transition-transform duration-300" id="modal-content">
            <div class="flex items-center gap-3 mb-4 text-rose-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <h3 class="text-lg font-bold text-slate-900" id="modal-title">Notice</h3>
            </div>
            <p class="text-slate-600 mb-6" id="modal-message"></p>
            <button id="modal-close" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold py-2.5 rounded-lg transition-colors">
                Okay
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment variables provided by system
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'fairshare-default-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, db, auth, currentUserId;

        // UI State
        let currentTipPercentage = 10;
        let unsubscribeHistory = null;

        // Initialize Firebase
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            authenticateUser();
        } catch (e) {
            console.error("Firebase init failed", e);
            updateAuthUI(false, "Offline mode");
        }

        async function authenticateUser() {
            try {
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
                
                if (auth.currentUser) {
                    currentUserId = auth.currentUser.uid;
                    updateAuthUI(true, "Cloud Sync Active");
                    loadHistory(); // load data after auth
                }
            } catch (error) {
                console.error("Auth error:", error);
                updateAuthUI(false, "Sync Disabled");
                showModal("Connection Error", "Could not connect to the cloud. Your history will not be saved.");
            }
        }

        function updateAuthUI(isOnline, text) {
            document.getElementById('auth-status').className = `w-2 h-2 rounded-full ${isOnline ? 'bg-green-500' : 'bg-red-500'}`;
            document.getElementById('auth-text').innerText = text;
        }

        // DOM Elements
        const form = document.getElementById('calculator-form');
        const toggleExceptionBtn = document.getElementById('toggle-exception');
        const exceptionPanel = document.getElementById('exception-panel');
        const exceptionChevron = document.getElementById('exception-chevron');
        const tipButtons = document.querySelectorAll('.tip-btn');
        const customTipInput = document.getElementById('custom-tip');
        const currencySelector = document.getElementById('currency-selector');
        const dynamicSymbols = document.querySelectorAll('.dynamic-currency-symbol');
        const resultsArea = document.getElementById('results-area');
        const resultsContent = document.getElementById('results-content');
        const historyList = document.getElementById('history-list');
        const emptyHistory = document.getElementById('empty-history');
        
        // Modal Elements
        const modal = document.getElementById('custom-modal');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalClose = document.getElementById('modal-close');

        function showModal(title, message) {
            modalTitle.innerText = title;
            modalMessage.innerText = message;
            modal.classList.remove('hidden');
            // Small delay to allow display:block to apply before animating opacity
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        modalClose.addEventListener('click', closeModal);

        // Toggle Exception Panel
        toggleExceptionBtn.addEventListener('click', () => {
            exceptionPanel.classList.toggle('hidden');
            if (exceptionPanel.classList.contains('hidden')) {
                exceptionChevron.classList.remove('rotate-180');
                // Optional: clear exception inputs when hidden
                document.getElementById('excluded-cost').value = '';
                document.getElementById('excluded-people').value = '';
            } else {
                exceptionChevron.classList.add('rotate-180');
            }
        });

        // Tip Selection Logic
        tipButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Remove active classes from all
                tipButtons.forEach(b => {
                    b.className = "tip-btn py-2 rounded-lg border-2 border-slate-200 text-slate-600 font-medium hover:border-brand-500 hover:text-brand-600 transition-colors";
                });
                customTipInput.value = ''; // Clear custom tip input
                
                // Add active class to clicked
                const target = e.target;
                target.className = "tip-btn active-tip py-2 rounded-lg border-2 border-brand-500 bg-brand-50 text-brand-700 font-medium transition-colors";
                
                currentTipPercentage = parseFloat(target.getAttribute('data-tip'));
            });
        });

        // Custom Tip Logic
        customTipInput.addEventListener('input', (e) => {
            // Remove active classes from buttons
            tipButtons.forEach(b => {
                b.className = "tip-btn py-2 rounded-lg border-2 border-slate-200 text-slate-600 font-medium hover:border-brand-500 hover:text-brand-600 transition-colors";
            });
            const val = parseFloat(e.target.value);
            currentTipPercentage = isNaN(val) ? 0 : val;
        });

        // Currency update
        currencySelector.addEventListener('change', (e) => {
            const sym = e.target.value;
            dynamicSymbols.forEach(el => el.innerText = sym);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Get values
            const rName = document.getElementById('restaurant-name').value.trim() || 'Unknown Restaurant';
            const billStr = document.getElementById('total-bill').value;
            const peopleStr = document.getElementById('total-people').value;
            const excludedCostStr = document.getElementById('excluded-cost').value;
            const excludedPeopleStr = document.getElementById('excluded-people').value;

            // Parse and Validate
            const bill = parseFloat(billStr);
            const people = parseInt(peopleStr, 10);
            
            if (isNaN(bill) || bill <= 0) {
                return showModal("Invalid Input", "Please enter a valid total bill amount greater than zero.");
            }
            if (isNaN(people) || people <= 0) {
                return showModal("Invalid Input", "There must be at least 1 person to split the bill.");
            }

            let excludedCost = 0;
            let excludedPeople = 0;

            if (!exceptionPanel.classList.contains('hidden')) {
                if (excludedCostStr) excludedCost = parseFloat(excludedCostStr);
                if (excludedPeopleStr) excludedPeople = parseInt(excludedPeopleStr, 10);
                
                if (excludedCost < 0) return showModal("Invalid Input", "Excluded cost cannot be negative.");
                if (excludedPeople < 0) return showModal("Invalid Input", "Number of excluded people cannot be negative.");
                if (excludedPeople >= people) {
                    return showModal("Wait a minute!", "The number of people who skipped the item cannot be equal to or greater than the total number of people.");
                }
                if (excludedCost > bill) {
                    return showModal("Math Error", "The cost of the excluded item cannot be larger than the total bill.");
                }
            }

            // Perform Math
            // 1. Tip Calc
            const tipAmount = bill * (currentTipPercentage / 100);
            const tipPerPerson = tipAmount / people;
            
            // 2. Base Bill (without exception item)
            const baseBill = bill - excludedCost;
            const basePerPerson = baseBill / people;

            // 3. Exception Item Share
            const eatersCount = people - excludedPeople;
            let itemSharePerEater = 0;
            if (eatersCount > 0) {
                itemSharePerEater = excludedCost / eatersCount;
            }

            // 4. Final totals
            const nonEaterPays = basePerPerson + tipPerPerson;
            const eaterPays = basePerPerson + itemSharePerEater + tipPerPerson;
            
            const totalToVerify = (nonEaterPays * excludedPeople) + (eaterPays * eatersCount);
            
            const selectedCurrency = currencySelector.value;
            
            // Build Result Data Object
            const resultData = {
                restaurant: rName,
                totalBill: bill,
                totalPeople: people,
                tipPercentage: currentTipPercentage,
                totalTip: tipAmount,
                finalTotal: bill + tipAmount,
                excludedCost: excludedCost,
                excludedPeople: excludedPeople,
                eatersCount: eatersCount,
                eaterAmount: eaterPays,
                nonEaterAmount: nonEaterPays,
                currencySymbol: selectedCurrency,
                date: new Date().toISOString()
            };

            // Render Results
            renderResults(resultData);

            // Save to Firebase
            if (currentUserId) {
                await saveToFirebase(resultData);
            }
        });

        function renderResults(data) {
            const sym = data.currencySymbol || '$';
            let html = `
                <div class="flex justify-between items-end border-b border-brand-200/60 pb-4 mb-4">
                    <div>
                        <p class="text-sm text-slate-500 font-medium">${data.restaurant}</p>
                        <p class="text-3xl font-bold text-slate-900 mt-1">${sym}${data.finalTotal.toFixed(2)}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-slate-500 mb-1">Bill: ${sym}${data.totalBill.toFixed(2)}</p>
                        <p class="text-xs text-brand-600 font-medium">Tip: ${sym}${data.totalTip.toFixed(2)} (${data.tipPercentage}%)</p>
                    </div>
                </div>
                
                <div class="space-y-3">
            `;

            if (data.excludedPeople > 0 && data.excludedCost > 0) {
                // Complex Split
                html += `
                    <div class="bg-white/60 p-4 rounded-xl flex items-center justify-between shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-brand-100 flex items-center justify-center text-brand-600 font-bold">
                                ${data.eatersCount}
                            </div>
                            <div>
                                <p class="font-semibold text-slate-800 text-lg">${sym}${data.eaterAmount.toFixed(2)} <span class="text-sm font-normal text-slate-500">each</span></p>
                                <p class="text-xs text-slate-500">Regular share + item + tip</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="bg-white/60 p-4 rounded-xl flex items-center justify-between shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center text-amber-600 font-bold">
                                ${data.excludedPeople}
                            </div>
                            <div>
                                <p class="font-semibold text-slate-800 text-lg">${sym}${data.nonEaterAmount.toFixed(2)} <span class="text-sm font-normal text-slate-500">each</span></p>
                                <p class="text-xs text-slate-500">Skipped item share</p>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                // Simple Equal Split
                html += `
                    <div class="bg-white/60 p-4 rounded-xl flex items-center justify-between shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-brand-100 flex items-center justify-center text-brand-600 font-bold">
                                ${data.totalPeople}
                            </div>
                            <div>
                                <p class="font-semibold text-slate-800 text-lg">${sym}${data.eaterAmount.toFixed(2)} <span class="text-sm font-normal text-slate-500">each</span></p>
                                <p class="text-xs text-slate-500">Equal split including tip</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            
            resultsContent.innerHTML = html;
            
            // Show with animation
            resultsArea.classList.remove('hidden');
            setTimeout(() => {
                resultsArea.classList.remove('opacity-0', 'scale-95');
            }, 10);
            
            // Smooth scroll to results on mobile
            if(window.innerWidth < 1024) {
                setTimeout(()=> {
                     resultsArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 100);
            }
        }

        async function saveToFirebase(data) {
            if (!currentUserId || !db) return;
            try {
                // Rule 1: STRICT paths. Private data.
                const historyRef = collection(db, 'artifacts', appId, 'users', currentUserId, 'splits');
                
                // Adding serverTimestamp for reliable ordering later
                const payload = {
                    ...data,
                    timestamp: serverTimestamp()
                };
                
                await addDoc(historyRef, payload);
            } catch (e) {
                console.error("Error saving to Firebase:", e);
                // Don't interrupt user flow for a save error, maybe just log it.
            }
        }

        function loadHistory() {
            if (!currentUserId || !db) return;
            
            // Rule 1 & Rule 2: Strict path, simple query (no complex orderBy)
            const historyRef = collection(db, 'artifacts', appId, 'users', currentUserId, 'splits');
            const q = query(historyRef);
            
            unsubscribeHistory = onSnapshot(q, (snapshot) => {
                // Filter and sort in JS to comply with Rule 2 (no complex indexing required)
                let docs = [];
                snapshot.forEach(doc => {
                    docs.push({ id: doc.id, ...doc.data() });
                });
                
                // Sort by date descending
                docs.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                renderHistoryList(docs);
            }, (error) => {
                console.error("Error fetching history:", error);
            });
        }

        function renderHistoryList(docs) {
            historyList.innerHTML = '';
            
            if (docs.length === 0) {
                historyList.classList.add('hidden');
                emptyHistory.classList.remove('hidden');
                emptyHistory.classList.add('flex');
                return;
            }
            
            emptyHistory.classList.add('hidden');
            emptyHistory.classList.remove('flex');
            historyList.classList.remove('hidden');

            docs.forEach(doc => {
                const sym = doc.currencySymbol || '$';
                const dateStr = new Date(doc.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
                
                let detailsStr = '';
                if (doc.excludedPeople > 0 && doc.excludedCost > 0) {
                    detailsStr = `<span class="text-brand-600">${doc.eatersCount} pay ${sym}${doc.eaterAmount.toFixed(2)}</span>, <span class="text-amber-600">${doc.excludedPeople} pay ${sym}${doc.nonEaterAmount.toFixed(2)}</span>`;
                } else {
                    detailsStr = `<span class="text-brand-600">Everyone pays ${sym}${doc.eaterAmount.toFixed(2)}</span>`;
                }

                const cardHtml = `
                    <div class="bg-slate-50 rounded-xl p-4 border border-slate-100 hover:bg-slate-100 transition-colors">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h4 class="font-semibold text-slate-800">${doc.restaurant}</h4>
                                <p class="text-xs text-slate-400">${dateStr} • ${doc.totalPeople} People</p>
                            </div>
                            <div class="text-right">
                                <p class="font-bold text-slate-900">${sym}${doc.finalTotal.toFixed(2)}</p>
                                <p class="text-[10px] uppercase tracking-wider text-slate-400">Total w/ Tip</p>
                            </div>
                        </div>
                        <div class="text-sm bg-white p-2 rounded-lg border border-slate-100 mt-2">
                            ${detailsStr}
                        </div>
                    </div>
                `;
                
                historyList.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // Cleanup on window unload
        window.addEventListener('beforeunload', () => {
            if (unsubscribeHistory) unsubscribeHistory();
        });
    </script>
</body>
</html>
